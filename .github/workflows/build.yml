# Builds the Loader and runs every check that does not need a graphics card: formatting, ModPatch = Patcher, the API
# references and compatibility, the access and dependency tests and the coverage. The preflight needs OpenGL and is
# skipped on the runner. Minecraft 1.8.9 comes from Mojang's CDN (./gradlew fetchMinecraft in the Bridge,
# sha1-checked) and is never published.
name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: loader
      # The Loader builds on the Bridge and the SDK, next to this repository. While those repositories are private,
      # the read-only deploy keys in BRIDGE_DEPLOY_KEY and SDK_DEPLOY_KEY open them; without the secret (public
      # repositories, pull requests from forks, which get no secrets) ssh-key is empty and checkout falls back to
      # the workflow token, which reads public repositories.
      - uses: actions/checkout@v4
        with:
          repository: Stein-Project/bridge
          path: bridge
          ssh-key: ${{ secrets.BRIDGE_DEPLOY_KEY }}
      - uses: actions/checkout@v4
        with:
          repository: Stein-Project/sdk
          path: sdk
          ssh-key: ${{ secrets.SDK_DEPLOY_KEY }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # Also checks that gradle-wrapper.jar is the official one.
      - uses: gradle/actions/setup-gradle@v4
      - name: Minecraft 1.8.9
        working-directory: bridge
        run: ./gradlew fetchMinecraft
      - name: Build and check
        working-directory: loader
        run: ./gradlew build -Pstein.mcDir=${{ github.workspace }}/bridge/build/mc
