# Builds a Loader version and keeps the files (steinloader.jar, stein-api.jar and its sources, the licences,
# SHA256SUMS) as a workflow artifact. It publishes nothing on its own: players get the Loader
# inside the installer, whose release workflow (Stein-Project/installer) builds it from source and publishes the pack
# to the public distribution repository Stein-Project/stein-loader. Mod authors get stein-api from the SDK's Maven
# repository (the "maven" branch of Stein-Project/stein-sdk, published by the SDK's release workflow).
#
# Triggers: a v<version> tag (the tag must match Loader.VERSION: it marks the commit of that version, and a mismatch
# fails the run) or by hand (Actions > release > Run workflow). Both do the same: build, check, artifact.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: loader
      # The Loader builds on the Bridge and the SDK (both public), next to this repository.
      - uses: actions/checkout@v4
        with:
          repository: Stein-Project/bridge
          path: bridge
      - uses: actions/checkout@v4
        with:
          repository: Stein-Project/sdk
          path: sdk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: version
        working-directory: loader
        run: |
          v=$(sed -n 's/.*String VERSION = "\([^"]*\)".*/\1/p' src/main/java/dev/xavier/stein/loader/Loader.java)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Loader.VERSION $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Minecraft 1.8.9
        working-directory: bridge
        run: ./gradlew fetchMinecraft
      - name: Build and check
        working-directory: loader
        run: ./gradlew build -Pstein.mcDir="$GITHUB_WORKSPACE/bridge/build/mc"
      - name: Files
        run: |
          mkdir dist
          cp loader/build/libs/{steinloader,stein-api,stein-api-sources}.jar dist/
          cp loader/{LICENSE,LICENSE-API,NOTICE} dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: stein-loader-${{ steps.version.outputs.version }}
          path: dist/
